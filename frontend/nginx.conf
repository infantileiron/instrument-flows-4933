server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz {
        proxy_pass http://backend:8000/health;
    }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
